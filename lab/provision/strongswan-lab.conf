# Lab-only settings, installed as /etc/strongswan.d/zz-pqc-lab.conf.
# Checked against strongSwan 6.1.0 in L1: both loggers and save-keys work under charon-systemd.
# Retransmission timers stay at their defaults on purpose: they shape results under loss.

charon {
    plugins {
        save-keys {
            # Session keys for Wireshark. LAB ONLY.
            load = yes
            ike = yes
            esp = yes
            wireshark_keys = /var/lib/pqc-lab/wireshark
        }
    }
}

charon-systemd {
    journal {
        default = 1
    }
    filelog {
        pqc-lab {
            # ms timestamps, cross-checked against the pcaps on pqc-wan
            path = /var/log/pqc-lab/charon.log
            time_format = %F %T
            time_add_ms = yes
            ike_name = yes
            append = yes
            default = 1
            ike = 2
            cfg = 1
            net = 1
            enc = 1
        }
    }
}
